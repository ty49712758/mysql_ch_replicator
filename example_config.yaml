
# MySQL and ClickHouse credentials can be overridden using environment variables:
# MySQL: MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_CHARSET
# ClickHouse: CLICKHOUSE_HOST, CLICKHOUSE_PORT, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD

mysql:
  host: 'localhost'
  port: 8306
  user: 'root'
  password: 'root'
  charset: 'utf8mb4'  # Optional: charset for MySQL connection (default: utf8mb4). Use utf8mb4 for full Unicode support including emoji and 4-byte characters

clickhouse:
  host: 'localhost'
  port: 8323
  user: 'default'
  password: 'default'

binlog_replicator:
  data_dir: '/home/user/binlog/'
  records_per_file: 100000

databases: 'database_name_pattern_*'

# Partition key for the ClickHouse tables. Tables are created WITHOUT a
# partition key unless configured here - a default such as intDiv(<pk>, 4294967)
# would put a 64-bit key (e.g. a snowflake id) in one partition per row and
# ClickHouse would reject the INSERT with TOO_MANY_PARTS.
#
# Rules are matched in order and create_table uses the first hit; a rule is
# skipped when the column it references is missing from the table or is
# Nullable, so a single catch-all rule works for a whole database.
#
# partition_bys:
#   - databases: '*'
#     tables: ['orders_*', 'events_*']
#     partition_by: 'toYYYYMM(bus_time)'   # business time
#   - databases: '*'
#     tables: '*'
#     partition_by: 'toYYYYMM(created)'    # fallback: creation time
